services:
  minio:
    image: ghcr.io/computingsquare/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      target: backend
    ports:
      - "4000:4000"
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      DEV_AUTH_HEADER_BYPASS: "true"
      AUTH_LOCAL_USERNAME: minioadmin
      AUTH_LOCAL_PASSWORD: minioadmin
      AUTH_JWT_SECRET: dev-jwt-secret-not-for-production
      NODE_ENV: production
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      # node:24-alpine has no curl.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio-data:
